  #     - ./data:/app/data
  #   networks:
  #     - tg-bot-net

  # ============ 可选：Nginx反向代理（管理后台用） ============
  # nginx:
  #   image: nginx:alpine
  #   container_name: tg-search-bot-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     # - ./ssl:/etc/nginx/ssl:ro  # HTTPS证书
  #   depends_on:
  #     - admin
  #   networks:
  #     - tg-bot-net

# ============================================================
# 备份服务：定时备份数据库到 ./data/backups + 可选同步到对象存储
# 单独运行：docker compose run backup
# ============================================================
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-search-bot:latest
    container_name: tg-search-bot-backup
    # 不随主服务启动，只手工或配合ofelia/宿主机cron执行
    profiles: ["tools"]
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    entrypoint: ["python", "-c"]
    command:
      - |
        import asyncio
        from app.admin.backup_manager import backup_manager
        async def main():
            result = await backup_manager.create_backup('scheduled', 'Docker定时备份')
            print(f"备份结果: {result}")
            await backup_manager.cleanup_old_backups()
            print(f"清理旧备份完成，保留最近{backup_manager.keep_count}份")
        asyncio.run(main())
    networks:
      - tg-bot-net

# ============================================================
# 充值检查服务：每5分钟检查USDT充值到账（第2步启用）
# ============================================================
  check-recharge:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-search-bot:latest
    container_name: tg-search-bot-recharge-checker
    profiles: ["tools"]
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    entrypoint: ["python", "-c"]
    command:
      - |
        import asyncio
        from app.wallet.wallet_manager import wallet_manager
        async def main():
            result = await wallet_manager.check_all_pending_recharges()
            if result:
                print(f"处理充值记录数: {len(result)}")
                for r in result:
                    print(f"  - 用户{r['user_id']}: {r['amount']}USDT -> 订单{r['order_id']}")
            else:
                print("无待处理充值")
        asyncio.run(main())
    networks:
      - tg-bot-net

# ============ 网络配置 ============
networks:
  tg-bot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
